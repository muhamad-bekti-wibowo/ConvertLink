<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Drive Link Converter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 50px;
        }
        input, button {
            padding: 10px;
            margin: 10px;
            width: 80%;
            max-width: 500px;
        }
        #output {
            margin-top: 20px;
            word-wrap: break-word;
        }
    </style>
</head>
<body>
    <h2>Google Drive Direct Link Converter</h2>
    <p>Masukkan link Google Drive untuk mendapatkan link unduhan langsung.</p>
    <input type="text" id="gdriveLink" placeholder="Masukkan link Google Drive...">
    <button onclick="convertLink()">Convert</button>
    <p id="output"></p>

    <script>
        function convertLink() {
            let inputLink = document.getElementById("gdriveLink").value;
            let match = inputLink.match(/\/d\/([a-zA-Z0-9_-]+)\/view/);
            
            if (match) {
                let fileId = match[1];
                let directLink = `https://drive.usercontent.google.com/download?id=${fileId}&export=download&authuser=0`;
                document.getElementById("output").innerHTML = `<strong>Direct Download Link:</strong> <br><a href="${directLink}" target="_blank">${directLink}</a>`;
            } else {
                document.getElementById("output").innerHTML = "<strong style='color:red;'>Format link tidak valid!</strong>";
            }
        }
    </script>
</body>
</html>
